<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Block Pit share card</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #070E24; }
    .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: radial-gradient(ellipse 90% 110% at 85% 40%, rgba(40, 70, 150, .28), transparent 75%), linear-gradient(120deg, #0A1430 0%, #0B1838 55%, #111A40 100%); }
    #fall { position: absolute; inset: 0; width: 1200px; height: 630px; }
    .copy { position: absolute; left: 88px; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; color: #fff; }
    .lockup { display: flex; align-items: center; gap: 30px; }
    .icon { width: 172px; height: 172px; border-radius: 40px; box-shadow: 0 0 0 2px rgba(255, 255, 255, .22), 0 18px 44px rgba(0, 0, 0, .45); }
    h1 { font-size: 104px; line-height: .86; letter-spacing: .05em; }
    h1 span { display: block; }
    .tag { margin-top: 40px; font-size: 38px; letter-spacing: .1em; }
    .tag b { font-weight: 700; }
    .badge { margin-top: 36px; height: 62px; width: auto; }
  </style>
</head>
<body>
  <div class="card">
    <canvas id="fall"></canvas>
    <div class="copy">
      <div class="lockup">
        <img class="icon" src="../assets/img/logo-320.png" alt="">
        <h1><span>Block</span><span>Pit</span></h1>
      </div>
      <p class="tag"><b class="k-r">Drop.</b> <b class="k-y">Match.</b> <b class="k-c">Chain.</b></p>
      <img class="badge" src="../assets/img/badges/app-store-black.svg" alt="">
    </div>
  </div>
  <script src="../js/iso.js"></script>
  <script>
    (function () {
      var I = window.BP.iso, cv = document.getElementById('fall');
      cv.width = 2400; cv.height = 1260;
      var ctx = cv.getContext('2d');
      ctx.scale(2, 2);
      var V = I.view(Math.PI / 4 - 0.22, 0.6);
      var CUBES = [
        [1150, 40, 46, 4, 0.5, 0.2, 3.2], [770, 70, 34, 1, 1.9, -0.3, 3.4], [1010, 600, 40, 2, 0.8, 0.4, 3],
        [690, 520, 30, 3, 2.4, 0.1, 3.6], [1120, 330, 38, 0, -0.6, 0.5, 2.8],
        [880, 150, 88, 3, 0.35, 0.15, 1.1], [1090, 190, 72, 4, -0.5, -0.2, 1.3], [790, 318, 58, 0, 1.2, 0.3, 1.5],
        [1030, 470, 96, 1, 0.9, -0.25, 0.9], [700, 110, 50, 2, -0.8, 0.2, 1.7],
        [930, 350, 150, 0, 0.18, 0.05, 0], [1110, 560, 170, 2, -0.35, 0.12, 0], [830, 560, 120, 3, 0.55, -0.1, 0], [1180, 150, 110, 1, 0.3, 0.25, 0]
      ];
      CUBES.forEach(function (c) {
        var x = c[0], y = c[1], size = c[2], col = c[3], yaw = c[4], tilt = c[5], blur = c[6];
        ctx.save();
        if (blur) { ctx.filter = 'blur(' + blur + 'px)'; ctx.globalAlpha = Math.max(0.35, 1 - blur * 0.18); }
        I.cubes(ctx, [{ x: -0.5, y: -0.5, z: -0.5, c: col, k: 1 }], { M: I.mul(V, I.mul(I.rotY(yaw), I.rotX(tilt))), s: size, x: x, y: y, pivot: [0, 0, 0] });
        ctx.restore();
      });
      document.body.setAttribute('data-ready', '1');
    })();
  </script>
</body>
</html>
